name: reader_desktop
description: Desktop app for full reader demo
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  file_picker: ^8.1.7
  window_manager: ^0.5.1
  foundation_domain:
    path: ../../packages/foundation/domain
  infrastructure_data:
    path: ../../packages/infrastructure/data
  engine_api:
    path: ../../packages/engines/engine_api
  engine_epub:
    path: ../../packages/engines/epub
  engine_pdf:
    path: ../../packages/engines/pdf
  engine_audio:
    path: ../../packages/engines/audio
  engine_ldf:
    path: ../../packages/engines/ldf

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: system
      name_windows: winsqlite3


