name: omnibook_desktop
description: OmniBook desktop app (Windows/macOS/Linux)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State / Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # UI adaptive
  flutter_adaptive_scaffold: ^0.2.0

  # File & path
  file_picker: ^8.0.6
  path_provider: ^2.1.4
  path: ^1.9.0

  # Desktop enhancements
  window_manager: ^0.3.9
  hotkey_manager: ^0.2.1
  desktop_drop: ^0.4.4

  # Networking / cache (可选但推荐)
  dio: ^5.7.0
  flutter_cache_manager: ^3.4.1

  # Shared packages (path deps)
  core:
    path: ../../packages/foundation/core
  domain:
    path: ../../packages/foundation/domain
  application:
    path: ../../packages/foundation/application
  data:
    path: ../../packages/infrastructure/data

  engine_api:
    path: ../../packages/engines/engine_api
  engine_epub:
    path: ../../packages/engines/epub
  engine_ldf:
    path: ../../packages/engines/ldf
  engine_pdf:
    path: ../../packages/engines/pdf
  engine_audio:
    path: ../../packages/engines/audio

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
