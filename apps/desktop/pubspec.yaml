name: reader_desktop
description: Desktop app for full reader demo
publish_to: none
version: 0.6.0+2007

resolution: workspace

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  fl_chart: ^0.69.0
  file_picker: ^8.1.7
  url_launcher: ^6.3.2
  window_manager: ^0.5.1
  foundation_domain:
    path: ../../packages/foundation/domain
  shared_ui:
    path: ../../packages/shared_ui
  foundation_application:
    path: ../../packages/foundation/application
  infrastructure_data:
    path: ../../packages/infrastructure/data
  services_search:
    path: ../../packages/infrastructure/services_search
  services_sync:
    path: ../../packages/infrastructure/services_sync
  kernel:
    path: ../../packages/engines/kernel
  engine_epub:
    path: ../../packages/engines/epub
  engine_pdf:
    path: ../../packages/engines/pdf
  engine_audio:
    path: ../../packages/engines/audio
  engine_ldf:
    path: ../../packages/engines/ldf

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

hooks:
  user_defines:
    sqlite3:
      source: system
      name_windows: winsqlite3



