name: reader_mobile
description: Mobile app for full reader demo
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  file_picker: ^8.1.7
  url_launcher: ^6.3.2
  foundation_domain:
    path: ../../packages/foundation/domain
  foundation_application:
    path: ../../packages/foundation/application
  infrastructure_data:
    path: ../../packages/infrastructure/data
  kernel:
    path: ../../packages/engines/kernel
  engine_epub:
    path: ../../packages/engines/epub
  engine_pdf:
    path: ../../packages/engines/pdf
  engine_audio:
    path: ../../packages/engines/audio
  engine_ldf:
    path: ../../packages/engines/ldf

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true



