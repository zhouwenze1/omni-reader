name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check embedded renderer assets
        run: node tools/check_renderer_assets.mjs

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze

      - name: Test parser packages
        working-directory: packages/parsers/reader_parser_epub
        run: dart test

      - name: Test services_search
        working-directory: packages/infrastructure/services_search
        run: dart test

      - name: Test kernel registry
        run: flutter test packages/engines/kernel

      - name: Test data layer
        run: flutter test packages/infrastructure/data

      - name: Test EPUB engine
        run: flutter test packages/engines/epub
