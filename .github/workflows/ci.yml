name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 阶段性方案:engines/epub 与 infrastructure/data 仍以 ../../../../reader_parser_next
      # 相对路径依赖 parser 仓库。monorepo 合并完成后(包移入 packages/parsers/)可删除以下两步。
      - name: Checkout sibling parser workspace
        uses: actions/checkout@v4
        with:
          repository: zhouwenze1/reader_parser_next
          path: reader_parser_next

      - name: Link parser workspace as pub path sibling
        run: ln -s "$GITHUB_WORKSPACE/reader_parser_next" "$GITHUB_WORKSPACE/../reader_parser_next"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check embedded renderer assets
        run: node tools/check_renderer_assets.mjs

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze

      - name: Test services_search
        working-directory: packages/infrastructure/services_search
        run: dart test

      - name: Test data layer
        run: flutter test packages/infrastructure/data

      - name: Test EPUB engine
        run: flutter test packages/engines/epub
