services:
  sync-server:
    build: .
    image: omni-sync-server:latest
    container_name: omni-sync
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 必填:管理页登录密码(https://<host>:8080/admin 生成/管理用户 token)
      ADMIN_PASSWORD: "change-me-admin-password"
      # 可选:首次启动种子 token,升级部署时保留原值即可延续旧数据
      # SYNC_TOKEN: "change-me-to-a-long-random-token"
      # SYNC_PORT: "8080"
      # SYNC_DEVICE_INACTIVE_DAYS: "180"
      # SYNC_BOOK_MAX_FILE_MB: "200"
      # SYNC_DB_PATH: "/data/sync.db"
    volumes:
      - sync-data:/data

volumes:
  sync-data:
