services:
  sync-server:
    build: .
    image: omni-sync-server:latest
    container_name: omni-sync
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 必填:换成你自己的随机 token,双端配置同一个
      SYNC_TOKEN: "change-me-to-a-long-random-token"
      # 可选
      # SYNC_PORT: "8080"
      # SYNC_DEVICE_INACTIVE_DAYS: "180"
      # SYNC_DB_PATH: "/data/sync.db"
    volumes:
      - sync-data:/data

volumes:
  sync-data:
